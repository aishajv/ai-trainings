[project]
name = "oncall"
version = "0.1.0"
description = "On-call MCP server: service owner, errors, recent deploys, runbook."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
